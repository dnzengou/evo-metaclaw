# Add manually as .github/workflows/ci.yml — the GitHub token used for
# scaffolding lacks the `workflow` scope, so this file could not be pushed
# via API. From a local clone: mkdir -p .github/workflows && cp evo-metaclaw-ci.yml .github/workflows/ci.yml && git add . && git commit -m "ci: ruff + pytest" && git push
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: python -m pytest -q
